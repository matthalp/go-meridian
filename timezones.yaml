# Timezone definitions for go-meridian
# Add new timezones here and run `make generate` to create the packages
#
# All timezones are generated in the timezones/ directory.
#
# Fields:
#   name:        package name (and directory under timezones/)
#   location:    IANA timezone name
#   description: human-readable timezone name
#   observes:    (optional) the offsets the location uses over the year, for
#                the package doc; completes "which observes ..."
#   deprecated:  (optional) marks the package deprecated with this message

timezones:
  - name: aest
    location: Australia/Sydney
    description: Australian Eastern Time
    observes: Australian Eastern Standard Time (AEST, UTC+10) and, from October to April, Australian Eastern Daylight Time (AEDT, UTC+11)

  - name: brt
    location: America/Sao_Paulo
    description: Brasília Time
    observes: UTC-3 year-round (Brazil abolished daylight saving time in 2019); the tz database abbreviates it as "-03" rather than "BRT"

  - name: cet
    location: Europe/Paris
    description: Central European Time
    observes: Central European Time (CET, UTC+1) and, in summer, Central European Summer Time (CEST, UTC+2)

  - name: cst
    location: Asia/Shanghai
    description: China Standard Time
    observes: China Standard Time (UTC+8) year-round. Not to be confused with US Central Standard Time, which is in package ct

  - name: ct
    location: America/Chicago
    description: Central Time
    observes: Central Standard Time (CST, UTC-6) and, in summer, Central Daylight Time (CDT, UTC-5)

  - name: est
    location: America/New_York
    description: Eastern Standard Time
    observes: Eastern Standard Time (EST, UTC-5) and, in summer, Eastern Daylight Time (EDT, UTC-4), despite the package name
    deprecated: Use package et, which is the same timezone (America/New_York). The name est suggests a fixed UTC-5 offset, but this package follows daylight saving time. Package est will be removed in v3.

  - name: et
    location: America/New_York
    description: Eastern Time
    observes: Eastern Standard Time (EST, UTC-5) and, in summer, Eastern Daylight Time (EDT, UTC-4)

  - name: gmt
    location: Europe/London
    description: Greenwich Mean Time
    observes: Greenwich Mean Time (GMT, UTC+0) in winter and British Summer Time (BST, UTC+1) in summer. It is UK civil time, not a fixed UTC+0 offset; use package utc for that

  - name: hkt
    location: Asia/Hong_Kong
    description: Hong Kong Time
    observes: Hong Kong Time (HKT, UTC+8) year-round

  - name: ist
    location: Asia/Kolkata
    description: India Standard Time
    observes: India Standard Time (IST, UTC+5:30) year-round

  - name: jst
    location: Asia/Tokyo
    description: Japan Standard Time
    observes: Japan Standard Time (JST, UTC+9) year-round

  - name: mt
    location: America/Denver
    description: Mountain Time
    observes: Mountain Standard Time (MST, UTC-7) and, in summer, Mountain Daylight Time (MDT, UTC-6). Arizona (America/Phoenix) does not observe daylight saving time and is not covered by this package

  - name: pt
    location: America/Los_Angeles
    description: Pacific Time
    observes: Pacific Standard Time (PST, UTC-8) and, in summer, Pacific Daylight Time (PDT, UTC-7)

  - name: pst
    location: America/Los_Angeles
    description: Pacific Standard Time
    observes: Pacific Standard Time (PST, UTC-8) and, in summer, Pacific Daylight Time (PDT, UTC-7), despite the package name
    deprecated: Use package pt, which is the same timezone (America/Los_Angeles). The name pst suggests a fixed UTC-8 offset, but this package follows daylight saving time. Package pst will be removed in v3.

  - name: sgt
    location: Asia/Singapore
    description: Singapore Time
    observes: UTC+8 year-round; the tz database abbreviates it as "+08" rather than "SGT"

  - name: utc
    location: UTC
    description: Coordinated Universal Time
