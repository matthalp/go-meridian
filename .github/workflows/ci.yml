name: CI

on:
  push:
    branches: [ main, 'release-v*' ]
  # Run on every PR regardless of base branch, so PRs into release or feature
  # branches are checked too.
  pull_request:

jobs:
  test:
    # Jobs are named by role rather than Go version so the required status
    # checks in branch protection don't change when the minimum moves.
    name: Test (Go ${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The go directive in go.mod; testing it keeps that claim honest.
          # Keep in sync with go.mod. Code that needs a newer Go (such as the
          # To method, Go 1.27) sits behind a //go:build go1.N constraint and
          # is only compiled and tested by the newer entries below.
          - name: minimum
            go: '1.26.x'
          # The Go releases the Go team currently supports.
          - name: oldstable
            go: oldstable
          - name: stable
            go: stable
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Generate coverage report
        if: matrix.name == 'stable'
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage to Codecov
        if: matrix.name == 'stable'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out
          flags: unittests
          name: codecov-umbrella

      - name: Upload coverage artifact
        if: matrix.name == 'stable'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage.html

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Keep in sync with GOLANGCI_LINT_VERSION in the Makefile.
          version: v2.14.0

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -v ./...

      - name: Verify go mod tidy
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod; then
            echo "go.mod is not tidy"
            exit 1
          fi
          if [ -f go.sum ] && ! git diff --exit-code go.sum; then
            echo "go.sum is not tidy"
            exit 1
          fi

      - name: Verify generated code is in sync
        run: |
          make generate
          # Check for both modified and untracked files
          if [ -n "$(git status --porcelain)" ]; then
            echo ""
            echo "ERROR: Generated timezone packages are out of sync with timezones.yaml"
            echo "Please run 'make generate' and commit the changes."
            echo ""
            echo "Changed/new files:"
            git status --porcelain
            echo ""
            echo "Diff of modified files:"
            git diff
            echo ""
            echo "Untracked files/directories:"
            git ls-files --others --exclude-standard
            exit 1
          fi
